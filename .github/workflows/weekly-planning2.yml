name: Create Weekly Discussion
on:
  schedule:
    - cron: '30 16 * * MON'  # Every Monday 16:30 UTC (when previous week ends)
  workflow_dispatch:  # Manual trigger button

jobs:
  create-discussion:
    runs-on: ubuntu-latest
    permissions:
      discussions: write
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DISCUSSIONS_TOKEN }}
          script: |
            const emojis = ['🧬', '🔬', '🌙', '🚀', '🎯', '🔮', '⚡', '🌟', '💎', '🎨', '🔥', '🌊', '🎪', '🎭'];
            const emoji = emojis[Math.floor(Math.random() * emojis.length)];
            
            const today = new Date();
            const date = today.toISOString().split('T')[0];
            
            // Calculate ISO week number
            const d = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            d.setDate(d.getDate() + 4 - (d.getDay() || 7));
            const yearStart = new Date(d.getFullYear(), 0, 1);
            const week = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
            const year = today.getFullYear();
            
            const body = `📊 [GitHub Project](https://github.com/orgs/OpenZeppelin/projects/41)

            **📅 Meeting:** Monday, ${date} · 15:30 – 16:15 UTC (16:30 – 17:15 CET)  
            **🎥 Video call:** https://meet.google.com/jjw-weky-jzg

            **📝 Meeting Notes:** [Will be added after meeting]

            ---

            ## 👥 Team

            **Management:**
            - 🔧 **Pepe (@pepebndc)** - Engineering Manager
            - 📋 **Khizer (@oz-khizer)** - Project Manager

            **Dev Team:**
            - @andrew-fleming
            - @0xisk
            - @emnul

            ---

            # 📕 Agenda

            - [ ] @username: agenda item

            ---
            
            **👥 Team updates below in comments - each person edit your own comment**`;

            const CATEGORY_ID = 'DIC_kwDORCQWoM4C1fAZ';
            const REPO_ID = 'R_kgDORCQWoA';  // Get this from the repo
            
            const mutation = `
              mutation($repositoryId: ID!, $categoryId: ID!, $title: String!, $body: String!) {
                createDiscussion(input: {
                  repositoryId: $repositoryId
                  categoryId: $categoryId
                  title: $title
                  body: $body
                }) {
                  discussion {
                    id
                    url
                  }
                }
              }
            `;
            
            const result = await github.graphql(mutation, {
              repositoryId: REPO_ID,
              categoryId: CATEGORY_ID,
              title: `${emoji} Week ${week}, ${year} - ${date}`,
              body: body
            });
            
            const discussionUrl = result.createDiscussion.discussion.url;
            const discussionNumber = discussionUrl.split('/').pop();
            
            // Dev team templates
            const andrewTemplate = `### 👻 Andrew (@andrew-fleming)

            **past week:**
            - 
            
            **this week:**
            - 
            
            **requests:**
            - `;
            
            const iskanderTemplate = `### 𓂀 Iskander (@0xisk)
            
            **past week:**
            
            <details>
            <summary>TODO</summary>
            
            - [ ] 
            
            </details>
            
            <details>
            <summary>Dev</summary>
            
            - [ ] 
            
            </details>
            
            <details>
            <summary>R&D</summary>
            
            - [ ] 
            
            </details>
            
            <details>
            <summary>Meetings</summary>
            
            - [ ] 
            
            </details>
            
            **this week:**
            - 
            
            **requests:**
            - `;
            
            const emTemplate = `### 👽 Em (@emnul)
            
            **past week:**
            
            <details>
            <summary>General</summary>
            
            - [ ] 
            
            </details>
            
            <details>
            <summary>Reviews</summary>
            
            - [ ] 
            
            </details>
            
            <details>
            <summary>PRs</summary>
            
            - [ ] 
            
            </details>
            
            **this week:**
            - 
            
            **requests:**
            - `;
            
            // Create comments for dev team members only
            const teamMembers = [
              { name: 'Andrew', username: 'andrew-fleming', template: andrewTemplate },
              { name: 'Iskander', username: '0xisk', template: iskanderTemplate },
              { name: 'Em', username: 'emnul', template: emTemplate }
            ];
            
            // Add comments for each dev team member
            const discussionNodeId = result.createDiscussion.discussion.id;
            
            for (const member of teamMembers) {
              const commentMutation = `
                mutation($discussionId: ID!, $body: String!) {
                  addDiscussionComment(input: {
                    discussionId: $discussionId
                    body: $body
                  }) {
                    comment {
                      id
                    }
                  }
                }
              `;
              
              try {
                await github.graphql(commentMutation, {
                  discussionId: discussionNodeId,
                  body: member.template
                });
                console.log(`Added comment for ${member.name}`);
              } catch (error) {
                console.error(`Failed to add comment for ${member.name}:`, error.message);
              }
            }
            
            console.log(`Created discussion with ${teamMembers.length} comments: ${discussionUrl}`);
