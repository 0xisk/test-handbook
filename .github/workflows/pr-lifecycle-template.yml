name: PR Lifecycle Template

on:
  workflow_call:
    secrets:
      PROJECT_TOKEN:
        required: true

permissions: {}

jobs:
  update-project-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: Verify PROJECT_TOKEN is set
        run: |
          if [ -z "${{ secrets.PROJECT_TOKEN }}" ]; then
            echo "::error title=Insufficient Permissions::PROJECT_TOKEN secret is not set"
            exit 1
          fi

      - name: Update project status
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          STATUS_FIELD_ID: ${{ vars.PROJECT_STATUS_FIELD_ID }}
          STATUS_OPTION_IN_PROGRESS: ${{ vars.PROJECT_IN_PROGRESS_COLUMN_NODE_ID }}
          STATUS_OPTION_NEEDS_REVIEW: ${{ vars.PROJECT_NEEDS_REVIEW_COLUMN_NODE_ID }}
          STATUS_OPTION_CLOSED: ${{ vars.PROJECT_CLOSED_COLUMN_NODE_ID }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const PROJECT_ID      = process.env.PROJECT_ID;
            const STATUS_FIELD_ID = process.env.STATUS_FIELD_ID;
            const STATUS_OPTIONS  = {
              in_progress:  process.env.STATUS_OPTION_IN_PROGRESS,
              needs_review: process.env.STATUS_OPTION_NEEDS_REVIEW,
              closed:       process.env.STATUS_OPTION_CLOSED,
            };

            // Validate required environment variables
            const missing = [];
            if (!PROJECT_ID)                  missing.push('PROJECT_ID');
            if (!STATUS_FIELD_ID)             missing.push('PROJECT_STATUS_FIELD_ID');
            if (!STATUS_OPTIONS.in_progress)  missing.push('PROJECT_IN_PROGRESS_COLUMN_NODE_ID');
            if (!STATUS_OPTIONS.needs_review) missing.push('PROJECT_NEEDS_REVIEW_COLUMN_NODE_ID');
            if (!STATUS_OPTIONS.closed)       missing.push('PROJECT_CLOSED_COLUMN_NODE_ID');
            if (missing.length > 0) {
              throw new Error(`Missing required environment variables: ${missing.join(', ')}`);
            }

            // Determine target status
            const { action, pull_request: pr } = context.payload;
            let targetStatus;
            if (action === 'closed') {
              targetStatus = STATUS_OPTIONS.closed;
            } else if (action === 'ready_for_review') {
              targetStatus = STATUS_OPTIONS.needs_review;
            } else if (action === 'converted_to_draft') {
              targetStatus = STATUS_OPTIONS.in_progress;
            } else if (action === 'opened' || action === 'reopened') {
              targetStatus = pr.draft
                ? STATUS_OPTIONS.in_progress
                : STATUS_OPTIONS.needs_review;
            }

            if (!targetStatus) return;

            // 1. Add PR to project (idempotent — safe to call even if already added)
            const addResult = await github.graphql(`
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: {
                  projectId: $projectId
                  contentId: $contentId
                }) {
                  item { id }
                }
              }
            `, {
              projectId: PROJECT_ID,
              contentId: pr.node_id,
            });

            const itemId = addResult.addProjectV2ItemById.item.id;

            // 2. Set the Status field
            await github.graphql(`
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }
            `, {
              projectId: PROJECT_ID,
              itemId,
              fieldId: STATUS_FIELD_ID,
              optionId: targetStatus,
            });

            core.info(`PR #${pr.number} → status set for action: ${action}`);
